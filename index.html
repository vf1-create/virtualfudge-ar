<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F3F3">
  <title>Virtual Fudge AR</title>
  <!-- Social link previews: switch og:image to an absolute https URL once the site is live -->
  <meta name="description" content="Try on Virtual Fudge AR: fudge shades, a digital twin, a little snow. Snap a selfie or video and share it. No app needed.">
  <meta property="og:title" content="Virtual Fudge AR · The Sweetest Season">
  <meta property="og:description" content="A holiday AR selfie from Virtual Fudge, the bespoke AR studio. Scan, snap, share. No app needed.">
  <meta property="og:image" content="https://vf1-create.github.io/virtualfudge-ar/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Virtual Fudge AR: The Sweetest Season">
  <meta property="og:url" content="https://vf1-create.github.io/virtualfudge-ar/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="modulepreload" href="vendor/mediapipe/vision_bundle.mjs">
  <link rel="preload" href="vendor/fonts/Syncopate-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/RobotoMono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 1. Intro: a page from the brochure -->
  <section id="intro" class="screen paper active">
    <span class="corners" aria-hidden="true"></span>
    <div class="mesh-wrap" aria-hidden="true"><svg class="mesh" viewBox="0 0 400 220"><g id="meshRings"></g></svg></div>
    <div class="intro-card">
      <img class="logo" src="assets/logo-paper.png" alt="Virtual Fudge" width="1200" height="575">
      <div class="headline">
        <p class="kicker"><span data-text="kicker"></span>&nbsp;· <span id="countdown"></span></p>
        <h1 data-text="seasonTitle"></h1>
      </div>
      <p class="lede" data-text="intro"></p>
      <button id="startBtn" class="btn primary">Open the camera <span aria-hidden="true">→</span></button>
      <p id="camError" class="cam-error" role="alert" hidden></p>
      <p class="fine">Runs on your device. Nothing is uploaded unless you share it.</p>
      <div id="desktopQR" class="qr-panel" hidden>
        <canvas id="qr" width="264" height="264" aria-label="QR code to open this page on your phone"></canvas>
        <p>Best on your phone.<br>Scan to open.</p>
      </div>
      <p class="tag"><span data-text="hashtag"></span> · <span data-text="website"></span></p>
    </div>
    <figure class="print-preview" aria-hidden="true">
      <div class="pp-photo"><img src="assets/mark.png" alt="" loading="lazy"><span class="pp-corners"></span></div>
      <figcaption class="pp-strip">
        <b data-text="kicker"></b>
        <span class="pp-title" data-text="seasonTitle"></span>
        <span class="pp-tag" data-text="hashtag"></span>
      </figcaption>
    </figure>
  </section>

  <!-- 2. Live AR camera -->
  <section id="ar" class="screen" aria-label="AR camera">
    <canvas id="stage" role="img" aria-label="Live camera preview with AR effects"></canvas>
    <video id="cam" playsinline muted autoplay></video>
    <div class="topbar">
      <button id="closeBtn" class="icon-btn" aria-label="Close">✕</button>
      <div class="top-right">
        <button id="timerBtn" class="icon-btn timer" aria-label="Self-timer off" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.75h5M18.5 6.5l1.25-1.25"/></svg>
          <span class="badge" hidden></span>
        </button>
        <button id="flipBtn" class="icon-btn" aria-label="Switch camera">⇆</button>
      </div>
    </div>
    <div id="hint" class="hint" role="status" hidden></div>
    <div id="modeLabel" class="mode-label" aria-live="polite"></div>
    <div id="countNum" class="count" aria-live="assertive"></div>
    <div id="loading" class="loading paper">
      <img class="logo" src="assets/logo-paper.png" alt="" width="1200" height="575">
      <div class="bar"><span></span></div>
      <p>Warming up the camera…</p>
    </div>
    <div id="filters" class="filters" role="radiogroup" aria-label="Filters"></div>
    <div class="bottombar">
      <button id="shutter" class="shutter" aria-label="Tap for photo, hold for video"><span></span></button>
      <p class="shutter-tip">Tap for photo · Hold for video</p>
    </div>
    <div id="flash" class="flash"></div>
  </section>

  <!-- 3. Result -->
  <section id="result" class="screen paper">
    <span class="corners" aria-hidden="true"></span>
    <h2 id="resultHeading" class="visually-hidden" tabindex="-1">Your photo is ready</h2>
    <div id="resultMedia" class="result-media"></div>
    <p id="resultMeta" class="result-meta"></p>
    <div class="result-actions">
      <button id="shareBtn" class="btn primary">Share <span aria-hidden="true">↗</span></button>
      <button id="retakeBtn" class="btn ghost">Retake</button>
      <button id="saveBtn" class="btn ghost">Save</button>
      <button id="copyBtn" class="btn ghost" hidden>Copy caption</button>
    </div>
    <p id="saveHint" class="tag-line" hidden></p>
    <p id="tagLine" class="tag-line"></p>
    <a id="cta" class="cta" target="_blank" rel="noopener" hidden></a>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Turn on JavaScript to use the Virtual Fudge AR camera.</p></noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
